[project]
name = "video-translator"
version = "0.1.0"
description = ""
authors = [
    {name = "subhajit-dubey", email = "subhajit-dubey@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14,!=3.14.1"

[tool.poetry.dependencies]
torch = { version = ">=2.14.1", source = "pytorch-cu126" }
torchvision = { version = ">=0.29.1", source = "pytorch-cu126" }
torchaudio = { version = ">=2.11.0", source = "pytorch-cu126" }
audio-separator = "^0.47.0"
audioread = "^3.1.0"
silero-vad = "^6.2.3"
soundfile = "^0.14.0"
onnxruntime = "^1.31.0"
faster-whisper = "^1.2.1"
av = "<18"
transformers = "^5.20.1"
sentencepiece = "^0.2.2"
pyannote-audio = "^4.0.7"
pyrubberband = "^0.4.0"
torchcodec = {version = "0.17.0+cu126", source = "pytorch-cu126"}
f5-tts = "^1.1.22"
datasets = ">=2.20.0"
python-dotenv = "^1.2.4"

[tool.poetry]
packages = [{include = "video_translator", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
tests = [
    "pytest (>=9.1.1,<10.0.0)"
]

[[tool.poetry.source]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
priority = "explicit"