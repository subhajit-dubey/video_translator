[project]
name = "video-translator-subdubzz"
version = "0.1.0"
description = "A interactive tool supporting video translation"
authors = [
    {name = "subhajit-dubey", email = "subhajit-dubey@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,!=3.14.1,<3.15"

dependencies = [
    "python-dotenv>=1.2.4,<2.0.0",
]

[project.optional-dependencies]

# Audio processing
audio = [
    "audio-separator>=0.47.0,<0.48.0",
    "audioread>=3.1.0,<4.0.0",
    "soundfile>=0.14.0,<0.15.0",
    "pyrubberband>=0.4.0,<0.5.0",
]

# Automatic speech recognition
asr = [
    "silero-vad>=6.2.3,<7.0.0",
    "faster-whisper>=1.2.1,<2.0.0",
    "av<18",
    "onnxruntime>=1.31.0,<2.0.0",
]

# NLP and language processing
nlp = [
    "transformers>=5.20.1,<6.0.0",
    "sentencepiece>=0.2.2,<0.3.0",
    "datasets>=2.20.0",
]

# Speaker diarization
diarization = [
    "pyannote-audio>=4.0.7,<5.0.0",
]

# Text-to-speech
tts = [
    "f5-tts>=1.1.22,<2.0.0",
    "piper-tts>=1.8.0,<2.0.0",
    "coqui-tts>=0.28.0,<0.29.0",
]

# Local LLM integration
llm = [
    "llama-cpp-python>=0.3.36,<0.4.0",
]

# Torch
[tool.poetry.group.torch]
optional = true

[tool.poetry.group.torch.dependencies]
torch = { version = ">=2.14.1", source = "pytorch-cu126" }
torchvision = { version = ">=0.29.1", source = "pytorch-cu126" }
torchaudio = { version = ">=2.11.0", source = "pytorch-cu126" }
torchcodec = {version = "0.17.0+cu126", source = "pytorch-cu126"}

[tool.poetry]
packages = [{include = "video_translator", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
tests = [
    "pytest (>=9.1.1,<10.0.0)"
]
dev = [
    "ruff (>=0.17.3,<0.18.0)",
    "mypy (>=2.4.1,<3.0.0)"
]

[tool.poetry.group.tests]
optional = true

[tool.poetry.group.dev]
optional = true

[[tool.poetry.source]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
priority = "explicit"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
disable_error_code = "unused-ignore"
ignore_missing_imports = true
exclude = [
    "tests/",
    ".venv/",
    "build/",
    "dist/",
]
